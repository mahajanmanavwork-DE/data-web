[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dataweb"
version = "0.1.0"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.1",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "python-dotenv==1.0.1",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "openpyxl==3.1.5",
    "numpy==2.1.3",
    "bcrypt==4.2.1",
    "filelock==3.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.8.2",
    "mypy==1.13.0",
]

[project.scripts]
dataweb = "dataweb_cli:main"

[tool.setuptools]
packages = []
py-modules = ["dataweb_cli", "main", "init_project"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "T20"]
ignore = ["E501", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "T201", "T203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
